version: "2"

run:
  # Lint the godog e2e specs too.
  build-tags: [e2e]

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers it
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    paths:
      - web/node_modules

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
