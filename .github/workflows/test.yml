name: test

on:
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # golangci-lint runs govet and gofmt too (.golangci.yml), with the e2e build tag.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # keep in sync with the go.mod tool
      - name: test
        run: go test ./...

  swagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: generate
        run: make swagger
      - name: spec is up to date
        run: |
          if [ -n "$(git status --porcelain docs/swagger)" ]; then
            echo "docs/swagger is out of date: run make swagger"
            git status --porcelain docs/swagger
            git diff docs/swagger
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test -v -tags e2e ./e2e/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API client up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/client || { echo "Run make client and commit web/src/client"; exit 1; }
      - name: lint
        run: npm run lint
      - name: format
        run: npm run fmt:check
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  e2e-ui:
    runs-on: ubuntu-latest
    # Browsers and system deps come with the image; tag must match @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build UI
        working-directory: web
        run: npm ci && npm run build
      - name: test
        working-directory: web
        run: npm run e2e
